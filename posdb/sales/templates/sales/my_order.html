{% extends 'base.html' %}
{% block content %}
<h2>ការបញ្ជាទិញរបស់ខ្ញុំ</h2>
<table>
  <thead>
    <tr><th>#</th><th>ស្ថានភាព</th><th>ថ្ងៃបង្កើត</th></tr>
  </thead>
  <tbody>
    {% for order in orders %}
    <tr>
      <td>{{ order.pk }}</td>
      <td>{{ order.status }}</td>
      <td>{{ order.created_at|date:"d/m/Y H:i" }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">មិនទាន់មានការបញ្ជាទិញ</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
