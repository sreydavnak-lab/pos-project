<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sales App{% endblock %}</title>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="{% url 'product_list' %}">Products</a> |
        <a href="{% url 'order_list' %}">All Orders</a> |

        {% if request.user.is_authenticated %}
            <a href="{% url 'my_orders' %}">My Orders</a> |
            <span>👤 {{ request.user.username }}</span> |
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>

    <hr>

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
